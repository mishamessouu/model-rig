# The agents to compare. Model and effort are configuration, not code.
# harness: claude (Claude Code) or codex (Codex CLI). Run one cell first.
# A cell may set cutoff = "YYYY-MM", the model's training cutoff, only when
# a primary source states it. A cell may set hosts = [...]; it replaces
# its harness's list in config/network.toml.

repeats = 3
timeout_seconds = 1800
# Claude Code stops at this spend. Codex has no such flag; the timeout holds it.
budget_usd = 20.0

[[cells]]
name = "claude-opus-medium"
harness = "claude"
model = "opus"
effort = "medium"

# Sonnet 5.5 by full id. The alias "sonnet" meant Sonnet 5 in Claude Code
# 2.1.302 (batch 20261016T205957Z, cell claude-sonnet-medium). Sonnet 5.5
# replaced it on 2026-10-20.
[[cells]]
name = "claude-sonnet-5-5-medium"
harness = "claude"
model = "claude-sonnet-5-5"
effort = "medium"

[[cells]]
name = "codex-sol-high"
harness = "codex"
model = "gpt-6.1-sol"
effort = "high"

[[cells]]
name = "codex-luna-medium"
harness = "codex"
model = "gpt-6-luna"
effort = "medium"

# Effort pairs: the same model at a second effort level.
[[cells]]
name = "codex-sol-medium"
harness = "codex"
model = "gpt-6.1-sol"
effort = "medium"

[[cells]]
name = "codex-luna-high"
harness = "codex"
model = "gpt-6-luna"
effort = "high"

[[cells]]
name = "codex-astra-medium"
harness = "codex"
model = "gpt-6-astra"
effort = "medium"

[[cells]]
name = "codex-astra-high"
harness = "codex"
model = "gpt-6-astra"
effort = "high"

# GPT-6.1 Terra, released 2026-10-26. The maintainer asked for it on 2026-10-27.
[[cells]]
name = "codex-terra-medium"
harness = "codex"
model = "gpt-6.1-terra"
effort = "medium"

[[cells]]
name = "codex-terra-high"
harness = "codex"
model = "gpt-6.1-terra"
effort = "high"

# Claude effort pairs and Fable 5.1. The maintainer asked for Anthropic models on
# high and for Fable 5.1 on 2026-10-25.
[[cells]]
name = "claude-opus-high"
harness = "claude"
model = "opus"
effort = "high"

[[cells]]
name = "claude-sonnet-5-5-high"
harness = "claude"
model = "claude-sonnet-5-5"
effort = "high"

[[cells]]
name = "claude-fable-5-1-medium"
harness = "claude"
model = "claude-fable-5-1"
effort = "medium"

[[cells]]
name = "claude-fable-5-1-high"
harness = "claude"
model = "claude-fable-5-1"
effort = "high"

# Haiku 5.5 against Luna medium. Model watch reported on 2026-10-25 that
# Haiku 5.5 beats GPT-6 Luna on the Artificial Analysis index at the same
# price. The maintainer asked for the cell the same day.
[[cells]]
name = "claude-haiku-5-5-medium"
harness = "claude"
model = "claude-haiku-5-5"
effort = "medium"
