# The agents to compare. Model and effort are configuration, not code.
# harness: claude (Claude Code) or codex (Codex CLI). Run one cell first.
# A cell may set cutoff = "YYYY-MM", the model's training cutoff, only when
# a primary source states it. A cell may set hosts = [...]; it replaces
# its harness's list in config/network.toml.

repeats = 3
timeout_seconds = 1800
# Claude Code stops at this spend. Codex has no such flag; the timeout holds it.
budget_usd = 20.0

# Claude cells name pinned model ids, not aliases: Claude Code 2.1.284
# moved `sonnet` from Sonnet 5 to Sonnet 5.5, so one alias named two models
# across batches (https://code.claude.com/docs/en/model-config, "Version
# history", read 2026-10-21). Cutoffs: "Training data cutoff" on
# https://platform.claude.com/docs/en/models/overview, read 2026-10-21.
[[cells]]
name = "claude-opus-medium"
harness = "claude"
model = "claude-opus-5-5"
effort = "medium"
cutoff = "2026-06"

# Sonnet 5, the `sonnet` alias before Claude Code 2.1.284. The wger batch
# of 2026-10-16 ran this cell as "claude-sonnet-medium".
[[cells]]
name = "claude-sonnet-medium"
harness = "claude"
model = "claude-sonnet-5"
effort = "medium"

# Sonnet 5.5 is a new cell, so a resumed batch never mixes it with Sonnet 5.
# Anthropic re-runs some security requests on Sonnet 5; by_model then
# names claude-sonnet-5 (https://www.anthropic.com/claude-sonnet-5-5).
[[cells]]
name = "claude-sonnet55-medium"
harness = "claude"
model = "claude-sonnet-5-5"
effort = "medium"
cutoff = "2026-06"

# The cheapest Claude model, as a floor for cost per successful fix.
[[cells]]
name = "claude-haiku-medium"
harness = "claude"
model = "claude-haiku-5-5"
effort = "medium"
cutoff = "2026-06"

[[cells]]
name = "codex-sol-high"
harness = "codex"
model = "gpt-6.1-sol"
effort = "high"

[[cells]]
name = "codex-luna-medium"
harness = "codex"
model = "gpt-6-luna"
effort = "medium"

# Effort pairs: the same model at a second effort level.
[[cells]]
name = "codex-sol-medium"
harness = "codex"
model = "gpt-6.1-sol"
effort = "medium"

[[cells]]
name = "codex-luna-high"
harness = "codex"
model = "gpt-6-luna"
effort = "high"

[[cells]]
name = "codex-astra-medium"
harness = "codex"
model = "gpt-6-astra"
effort = "medium"

[[cells]]
name = "codex-astra-high"
harness = "codex"
model = "gpt-6-astra"
effort = "high"
