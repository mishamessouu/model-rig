# Price sheets, per 1M tokens. A model key matches any model id it starts with.

[sheets.copilot]
unit = "credits"
source = "GitHub Copilot credits per 1M tokens, as listed in the Copilot model picker on 2026-10-16"

[sheets.copilot.models."claude-opus-5-5"]
input = 400
output = 2000
cache_read = 20
cache_write = 500

