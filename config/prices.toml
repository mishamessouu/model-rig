# Price sheets, per 1M tokens. A model key matches any model id it starts with.

[sheets.copilot]
unit = "credits"
source = "docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing, read 2026-10-20 (USD per 1M x 100; 1 AI credit = 0.01 USD)"
# First read from the Copilot model picker on 2026-10-16. Checked against the
# GitHub pricing page on 2026-10-20: the picker had rounded two values down
# (Luna cache write 12.5, GPT-5.3-Codex cache read 17.5). Each model is billed
# at provider list price, and the Anthropic and OpenAI pages agree.
# Sol, Terra, Luna, and Astra cost more per token above 272K input tokens in one
# request. These rows are the lower tier. The rig stores token totals per
# run, not per request, so it cannot show which tier a request fell in.

[sheets.copilot.models."claude-opus-5-5"]
input = 400
output = 2000
cache_read = 20
cache_write = 500

[sheets.copilot.models."gpt-6.1-sol"]
input = 200
output = 1000
cache_read = 10
cache_write = 250

# GPT-6.1 Terra, lower tier, from the GitHub pricing page read 2026-10-27.
# The OpenAI model page agrees (1 / 5 USD per 1M, cached input 0.05).
[sheets.copilot.models."gpt-6.1-terra"]
input = 100
output = 500
cache_read = 5
cache_write = 125

[sheets.copilot.models."gpt-6-luna"]
input = 10
output = 50
cache_read = 1
cache_write = 12.5

[sheets.copilot.models."gpt-5.3-codex"]
input = 175
output = 1400
cache_read = 17.5
cache_write = 0

[sheets.copilot.models."claude-sonnet-5-5"]
input = 200
output = 1000
cache_read = 10
cache_write = 250

# Sonnet 5 has a cache read twice that of Sonnet 5.5. The key must not be a
# prefix of claude-sonnet-5-5, so prices.py matches the longest key first.
[sheets.copilot.models."claude-sonnet-5"]
input = 200
output = 1000
cache_read = 20
cache_write = 250

[sheets.copilot.models."gpt-6-astra"]
input = 1000
output = 5000
cache_read = 100
cache_write = 1250

# Fable 5.1 at Anthropic list price (10 / 50 USD per 1M, cache read 0.25,
# 5-minute cache write 1.25x input), from the claude-api skill models page,
# read 2026-10-25. Not checked against the Copilot page.
[sheets.copilot.models."claude-fable-5-1"]
input = 1000
output = 5000
cache_read = 25
cache_write = 1250

# Haiku 5.5 at list price (0.10 / 0.50 USD per 1M), from the Artificial
# Analysis API, read 2026-10-25. Cache read 0.1x and 5-minute cache write
# 1.25x input, the Anthropic ratios. Not checked against the Copilot page.
[sheets.copilot.models."claude-haiku-5-5"]
input = 10
output = 50
cache_read = 1
cache_write = 12.5
