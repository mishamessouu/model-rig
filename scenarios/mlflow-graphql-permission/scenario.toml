# The hidden file holds upstream's tests from the fix commit, taken from
# two upstream modules, with changes listed at its top. The fix closes two
# holes in GraphQLAuthorizationMiddleware:
# - s1, the advisory: the nested field run.modelVersions (under
#   mlflowGetRun and mlflowSearchRuns) lists every model version created
#   from a run, through the unfiltered search, so a user who can read the
#   run sees versions, sources, and tags of models they cannot read.
# - s2, a second hole in the same commit: the top-level
#   mlflowSearchModelVersions judges every row by registered-model grants.
#   A wildcard registered-model READ grant then reveals prompt versions,
#   tags included, so the prompt template text leaks. The REST search
#   (filter_search_model_versions) already judges a prompt by prompt
#   grants and returns nothing for the same user; checked on 2026-10-20.
#   Upstream tested it in its own test, which this scenario splits in two.
# Both defects share the upstream fix as their reference solution. A fix
# of either part alone was scored on 2026-10-20 and fixes exactly its
# defect: the nested part with the old registered-model predicate fixes
# s1, and the switch to _rm_or_prompt_read_predicate in
# _filter_model_versions_result fixes s2. Two other correct s1 fixes also
# pass: "modelVersions" in PROTECTED_FIELDS by name with
# _graphql_can_read_model, and a filter in
# MlflowRunExtension.resolve_model_versions (graphql_schema_extensions.py).
# The tests call the HTTP API only, so the place of a fix does not matter.
#
# The s2 defect has two tests. The first is the leak. The second asks
# that a prompt grant reveal the prompt version, as on the REST search;
# without it, hiding every prompt version from GraphQL would count as a
# fix (wrong/hide-prompts-top-level.patch).

[[defects]]
id = "s1-nested-run-model-versions"
rung = 3
kind = "security"
summary = "GraphQL run.modelVersions, reached through mlflowGetRun or mlflowSearchRuns, skips the per-model READ filter, so a user who can read a run sees every model version created from it."
tests = [
  "tests/server/auth/test_graphql_model_version_permissions.py::test_graphql_nested_run_model_versions_filtered_by_model_permission",
  "tests/server/auth/test_graphql_model_version_permissions.py::test_nested_run_model_versions_use_requested_workspace_grants",
]

[[defects]]
id = "s2-prompt-versions-by-model-grant"
rung = 2
kind = "security"
summary = "GraphQL mlflowSearchModelVersions judges prompt versions by registered-model grants, so a wildcard model grant reveals prompt versions and their template text, and a prompt grant reveals nothing."
tests = [
  "tests/server/auth/test_graphql_model_version_permissions.py::test_graphql_search_model_versions_model_grant_does_not_reveal_prompt",
  "tests/server/auth/test_graphql_model_version_permissions.py::test_graphql_search_model_versions_prompt_grant_reveals_prompt",
]
solution = "s1-nested-run-model-versions"

# The hidden "still sees" tests catch a fix that hides too much. The
# test_auth.py ids are the GraphQL and model version tests from the
# visible run that touch the changed code.
[regression]
tests = [
  "tests/server/auth/test_graphql_model_version_permissions.py::test_nested_run_model_versions_permitted_reader_sees_all",
  "tests/server/auth/test_graphql_model_version_permissions.py::test_nested_run_model_versions_wildcard_reader_and_admin_see_all",
  "tests/server/auth/test_graphql_model_version_permissions.py::test_nested_run_model_versions_follow_a_new_grant",
  "tests/server/auth/test_auth.py::test_graphql_search_model_versions",
  "tests/server/auth/test_auth.py::test_graphql_requires_authentication",
  "tests/server/auth/test_auth.py::test_graphql_get_experiment_authorization",
  "tests/server/auth/test_auth.py::test_graphql_get_run_authorization",
  "tests/server/auth/test_auth.py::test_graphql_search_runs_authorization",
  "tests/server/auth/test_auth.py::test_graphql_list_artifacts_authorization",
  "tests/server/auth/test_auth.py::test_graphql_nonexistent_run",
  "tests/server/auth/test_auth.py::test_search_model_versions",
  "tests/server/auth/test_auth.py::test_search_registered_models",
  "tests/server/auth/test_client_workspace.py",
]
