# MLflow with one real security fix taken out (bug reinjection).
# The agent sees the prepared fixture only. hidden/ and solutions/ never
# enter its sandbox. Prepare once, with network, before check or run:
#
#     python3 -m rig prepare mlflow-graphql-permission

name = "mlflow-graphql-permission"
summary = "MLflow basic-auth: GraphQL shows model versions and prompt versions that the user has no grant to read (one upstream fix, two holes)."
language = "python"
# The day of the upstream fix (395db9d, below). `rig run` warns for a cell
# whose training cutoff is on or after it.
fix_date = "2026-09-16"

# Upstream: github.com/mlflow/mlflow, Apache-2.0, Flask tracking server
# with the basic-auth app (mlflow.server.auth). Advisory
# GHSA-f253-vggg-rwh8, named in the fix commit. It was not public on
# 2026-10-20. Fix commit 395db9deef3d7487511eed8df85f77aedd799de1
# (2026-09-16) changes one app file, mlflow/server/auth/__init__.py.
# The fixture is the fix commit's parent, the vulnerable state, as it was.
# No revert patch is needed: the fix tests do not exist there yet.
# Upstream CI did not finish its Python tests on the parent (skipped, or
# cancelled by a newer push), so the baseline was checked here on
# 2026-10-20, with this venv, outside the sandbox: tests/server/auth
# passes on the parent but for two tests that fail the same way on the
# fix commit. test_webhook_admin_only_permissions gets 400 when the admin
# creates a webhook, and test_proxy_log_artifacts hangs. Neither is in
# the visible or regression set.
[fixture]
git = "https://github.com/mlflow/mlflow.git"
commit = "08dfbc936c6c4f1e2585b554d69c094cb0f63c68"

# A venv under the rig state folder, filled from upstream's uv.lock: no
# default groups (they pull pyspark and the linters), the `pytest` group,
# and the `auth` extra. About 620 MB. --python 3.12 keeps the system
# Python that the bootstrap venv uses; upstream pins 3.10 in
# .python-version, and uv would otherwise replace the venv with a
# downloaded 3.10. The project is installed editable; its finder names the
# fixture path, which both sandboxes hide, and runs from the working copy
# find `mlflow` on the path first. Two test-only imports are not in any
# small group: starlette's test client (imported by tests/server/conftest.py)
# needs httpx, and test_auth.py imports jwt. CI installs them unpinned
# from requirements/test-requirements.txt; here they are pinned to the
# versions in uv.lock (httpcore is httpx's dependency).
[environment]
setup = [
  "pip install --quiet uv==0.13.1",
  "uv sync --frozen --python 3.12 --no-default-groups --group pytest --extra auth --inexact",
  "uv pip install --quiet httpx==0.28.1 httpcore==1.0.9 pyjwt==2.13.0",
]

[tests]
command = ["python3", "-m", "pytest", "-q", "{tests}"]
# The agent's run, the command the prompts name: five auth modules, about
# 450 tests and 2 min offline. test_auth.py is left out: most of its 286
# tests start an MLflow server in a subprocess, and the module takes about
# 10 min. On the rig box test_proxy_log_artifacts also hangs (its
# `mlflow server` never answers; 2026-10-20). A -k selection of it would name
# GraphQL in the prompt and point the open and ddd prompts at the hole.
# The regression set runs its GraphQL and model version search tests.
visible = [
  "tests/server/auth/test_client_workspace.py",
  "tests/server/auth/test_client_rbac.py",
  "tests/server/auth/test_auth_workspace.py",
  "tests/server/auth/test_sqlalchemy_store_rbac.py",
  "tests/server/auth/test_permissions.py",
]
# One test id starts one or two servers. The visible run takes about
# 2 min alone, and more on a busy box.
timeout_seconds = 300
hidden_into = "tests/server/auth"
# Visible test files the regression set and the hidden file use, restored
# from the fixture before scoring, with the conftest files, the auth
# config, and the helpers they stand on.
pristine = [
  "pyproject.toml",
  "tests/__init__.py",
  "tests/conftest.py",
  "tests/helper_functions.py",
  "tests/server/__init__.py",
  "tests/server/conftest.py",
  "tests/server/auth/__init__.py",
  "tests/server/auth/auth_test_utils.py",
  "tests/server/auth/fixtures/no_permission_auth.ini",
  "tests/server/auth/test_auth.py",
  "tests/server/auth/test_client_workspace.py",
  "tests/tracking/__init__.py",
  "tests/tracking/integration_test_utils.py",
]

[prompts]
