security = """
This repository is InvenTree, an inventory management system built with \
Django and Django REST Framework. Look for a security weakness. Pick the \
one that matters most and fix it. Make one change only. Run the tests with \
`cd src/backend/InvenTree && INVENTREE_DB_ENGINE=sqlite3 \
INVENTREE_DB_NAME=/tmp/inventree.sqlite3 \
INVENTREE_MEDIA_ROOT=/tmp/inventree-media \
INVENTREE_STATIC_ROOT=/tmp/inventree-static \
INVENTREE_BACKUP_DIR=/tmp/inventree-backup \
INVENTREE_SITE_URL=http://localhost:8000 INVENTREE_DEBUG=true \
INVENTREE_CONSOLE_LOG=false INVENTREE_PLUGINS_ENABLED=true python3 \
manage.py test --noinput common.test_api common.tests.AttachmentTest \
part.test_api.AttachmentTest` before you finish. End your answer with one \
line that starts with `CHOICE:` and says what you changed and why.
"""

# The fix adds two read checks to common/api.py. Attachments are one
# generic table keyed by (model_type, model_id), with no role of their own.
# Writes already check the linked model's permission; reads did not. So
# any signed-in user, with no role at all, could read every attachment's
# comment, link, and file name. Each read path is its own defect, so an
# agent that closes one gets credit for it. Both share the upstream fix as
# their reference solution.
# - s1, the list: AttachmentList returns every attachment, with or
#   without a model_type filter or a search.
# - s2, the detail: AttachmentDetail.retrieve() returns any attachment by
#   id.
#
# The hidden tests are ours; see the header of each file. Lessons from the
# first batches on 2026-10-20 apply:
# - Defect tests grade the effect only: the response holds neither the
#   attachment's row nor its comment or link. Any refusal passes, by any
#   4xx or 5xx status or by an exception. Upstream's test asserts 403 on a
#   denied detail read, so a fix that answers 404 would fail it; it stays
#   in the hidden file, unscored.
# - Whether allowed reads still work is a regression test, never part of a
#   defect test. The regression module also imports upstream's visible
#   attachment test classes, so one test database covers them all.
# - The attack path is the HTTP API, and every test goes through it.
# - wrong/ holds six plausible wrong fixes; right/ holds a correct fix in
#   another place (the shared mixin) and a correct half fix (detail only,
#   404). rig check scores both folders.

[[defects]]
id = "s1-attachment-list-read"
rung = 3
kind = "security"
summary = "The attachment list returns attachments of every model type, so a user with no view permission on parts or stock items lists their attachments' comments, links, and files."
tests = [
  "common.test_attachment_access.AttachmentListAccessTest",
]

[[defects]]
id = "s2-attachment-detail-read"
rung = 3
kind = "security"
summary = "The attachment detail view returns any attachment by id, without the view permission check that its update and delete already make on the linked model."
tests = [
  "common.test_attachment_access.AttachmentDetailAccessTest",
]
solution = "s1-attachment-list-read"

[regression]
# One module: model-rig's allowed-read tests, and upstream's attachment
# tests from common/test_api.py, common/tests.py, and part/test_api.py.
tests = [
  "common.test_attachment_regression",
]
