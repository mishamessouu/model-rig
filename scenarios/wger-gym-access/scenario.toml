# wger with three real security fixes taken out (bug reinjection).
# The agent sees the prepared fixture only. hidden/ and solutions/ never
# enter its sandbox. Prepare once, with network, before check or run:
#
#     python3 -m rig prepare wger-gym-access

name = "wger-gym-access"
summary = "wger workout tracker: two gym config edit views miss an access check, and gym admins reset the passwords of accounts at or above their role (three upstream fixes)."
language = "python"
# The day of all three upstream fixes (below). `rig run` warns for a cell whose
# training cutoff is on or after it.
fix_date = "2026-10-04"

# Upstream: github.com/wger-project/wger, AGPL-3.0, Django and DRF.
# No published advisory on 2026-10-20. Three scored fix commits, all
# 2026-10-04:
# - d0ca31ca89be213a4c84b6793df2247fa85469b1 (20:19 +02:00), "Enforce the
#   permission on the gym admin config edit view". Parent 6a90e34f.
# - dd28603abe5b5e3b33eb61e0f3baa94b36052e87 (20:56 +02:00), "Compare the
#   gym of the config in the gym config edit view". Parent 5c1817e9.
# - 5c1817e9d56bed3c887b7dcc7b5434dd80de12a6 (20:52 +02:00), "Check the
#   target's role before gym admins act on an account". Parent f0a8493f.
#   Scored since 2026-10-23 (s3 to s6). wger/gym/views/gym.py and
#   wger/gym/helpers.py do not change between 6a90e34f and f0a8493f, so
#   its holes are open in the fixture as upstream left them.
# The fixes sit on different parents. The fixture is the earlier fix's
# parent, 6a90e34f, as it was. dd28603a's hole is open there too:
# wger/gym/views/config.py does not change between 6a90e34f and
# dd28603a's parent. So no revert patch is needed. The fix tests do not
# exist there yet.
# Two more upstream security fixes landed between 6a90e34f and dd28603a.
# Their holes are open in the fixture and are not scored, so an agent that
# fixes one scores "none" for it. Why, as of 2026-10-23:
# - 3336876b "Require a login to add gallery images" (ImageAddView had no
#   LoginRequiredMixin). No security effect to test in the fixture: an
#   anonymous POST raises a ValueError in form_valid() (the image's user
#   must be a User) and stores nothing, and the GET shows an empty form.
#   A probe on the fixture confirmed both. An effect test passes on the
#   baseline, so it cannot be a defect test. No run touched the gallery.
# - f0a8493f "Build links in account emails from SITE_URL" (a forged Host
#   header lands in password reset and confirmation links). The effect is
#   testable, but only with ALLOWED_HOSTS = ['*']. settings/main.py ships
#   that as a default to change in production, and settings/ci.py sets it
#   too. A fix that restricts ALLOWED_HOSTS in main.py is a fair fix, but
#   the tests run with settings.ci, so a hidden test would grade where the
#   fix sits. Upstream's test sidesteps this with override_settings. No
#   run of the two 2026-10-20 batches touched it.
# - 5c1817e9 also closes two holes next to the reset: UserEditView lets a
#   gym admin change the email of an account above their role (then a
#   password reset by email hands it over), and gym_permissions_user_edit
#   lets a manager remove a general manager's roles. Not scored yet: no
#   run touched either. Each would need its own hidden tests and patches.
# 6a90e34f itself is a security fix (trainer-login session), so that hole
# is closed.
[fixture]
git = "https://github.com/wger-project/wger.git"
commit = "6a90e34fce4419f4d5cafdf635e14f10c280ef11"

# A venv under the rig state folder, filled from upstream's uv.lock, as for
# wger-log-idor. It is bound read-only into the agent and scoring
# sandboxes, first on PATH.
[environment]
setup = [
  "pip install --quiet uv==0.13.1",
  "uv sync --frozen --group dev --no-install-project --inexact",
]

[tests]
command = ["python3", "manage.py", "test", "--settings=settings.ci", "--noinput", "{tests}"]
# No ids: the visible run is the whole suite, the command the prompts name.
# At this commit that is 2,311 tests, 285 s on the cloud container where
# the scenario was built (2026-10-20). 300 s timed the visible run out.
visible = []
timeout_seconds = 900
hidden_into = "wger/gym/tests"
# Visible test files the regression set uses, restored from the fixture
# before scoring, with the base class they stand on.
pristine = [
  "wger/core/tests/base_testcase.py",
  "wger/gym/tests/test_config.py",
  "wger/gym/tests/test_admin_config.py",
  "wger/gym/tests/test_user_config.py",
  "wger/gym/tests/test_gym.py",
  "wger/gym/tests/test_inactive_members.py",
  "wger/gym/tests/test_user.py",
]

[prompts]
open = """
This repository is wger, a workout and nutrition tracker built with Django. \
Find the one improvement that matters most to you, and make it. Make one \
change only. Run the tests with \
`python3 manage.py test --settings=settings.ci` before you finish. End your \
answer with one line that starts with `CHOICE:` and says what you changed \
and why.
"""

ddd = """
This repository is wger, a workout and nutrition tracker built with Django. \
Look for a domain-driven design improvement: a domain concept that is \
missing, logic in the wrong layer, or a business rule that is written in \
more than one place. Pick the one that matters most and make it. Make one \
change only. Run the tests with \
`python3 manage.py test --settings=settings.ci` before you finish. End your \
answer with one line that starts with `CHOICE:` and says what you changed \
and why.
"""

security = """
This repository is wger, a workout and nutrition tracker built with Django. \
Look for a security weakness. Pick the one that matters most and fix it. \
Make one change only. Run the tests with \
`python3 manage.py test --settings=settings.ci` before you finish. End your \
answer with one line that starts with `CHOICE:` and says what you changed \
and why.
"""

# The hidden files hold the tests the three fix commits added, adapted,
# plus tests of ours: test_gym_config_access.py for d0ca31ca and dd28603a
# (s1, s2), test_reset_password_role.py for 5c1817e9 (s3 to s6). Each
# change is listed at the top of its file and marked "model-rig" where it
# happens. Each fix closes its own hole, so each is its own defect with
# its own upstream fix as the reference solution.
#
# The rules from the 2026-10-20 batches:
# - Defect tests check the effect: the other gym's config, or the admin
#   config, is unchanged, and a GET does not show another gym's config.
#   No defect test asserts a status code. A refusal by any 4xx or 5xx, a
#   redirect, a form error, or an exception in the view passes.
# - The legitimate flows (a manager edits their own gym's config, a
#   trainer or manager with the permission edits their own admin config)
#   are regression tests, never part of a defect test.
# - No advisory names an attack path. The defect tests go through the
#   views end to end, so a fix at any layer that stops the effect passes.
# - right/ holds correct fixes in other places, each with a `Fixes:` line.
#
# The reset defects (s3 to s6, added 2026-10-23). reset_user_password()
# checks only that a gym manager and the target share a gym, and a
# general manager passes with no check at all. The view sets a new
# password and shows it, so a reset hands over the account. Upstream's
# helper outranks() closes this: superusers outrank everybody; nobody
# else outranks an account that holds manage_gyms (a general manager, the
# admin) or a superuser; general managers outrank the rest; managers
# outrank only accounts with no gym role. It reads roles from the
# permission tables, because has_perm() is False for inactive accounts,
# and a manager may activate an account of their gym again. Upstream's
# ten tests and outranks() are the measure of "correct". Each path is its
# own defect, so an agent that closes the worst path gets credit for it:
# - s3: a manager resets the admin, a general manager, or a superuser of
#   their gym. A vertical takeover. Upstream tests the admin; the other
#   two are ours, and outranks() refuses them.
# - s4: a manager resets a fellow manager or a trainer, active or
#   deactivated. Upstream's three tests. Lower impact, since a manager
#   already resets every member, but upstream refuses it.
# - s5: a general manager resets the admin, another general manager, or a
#   superuser. Upstream's three tests.
# - s6 (ours): a manager resets a deactivated general manager or admin.
#   A fix that reads the target's roles with has_perm() closes s3 but not
#   s6. Kept apart from s3 so that this edge case, which upstream's fix
#   covers but its tests check for a trainer only, does not decide s3.
# A defect test checks the effect: the target's password hash is
# unchanged, and no password the response shows signs the target in. Any
# refusal passes. The legitimate resets (a manager resets a member of
# their gym, a general manager resets a trainer or a manager, a superuser
# resets a general manager) are regression tests, with test_user.py, whose
# same-gym tests also reset a member.
#
# In the two 2026-10-20 batches, before these defects were scored, 23 of
# the 36 runs changed reset_user_password. Most Codex runs refused only
# staff or superuser targets. A general manager is not staff, so a
# manager still takes one over, and those runs fix no reset defect:
# wrong/reset-staff-target.patch is that shape.
#
# Not scored: upstream's test_config_of_own_gym. Manager3 of gym 2 edits
# config 3, and the unfixed view refuses that because it compares the URL
# pk with the gym id. So it fails on the baseline, and a regression test
# must pass there. A fix that stays secure but keeps refusing this edit
# (such as "refuse when either id differs") scores as a fix.

[[defects]]
id = "s1-gym-config-other-gym"
rung = 2
kind = "security"
summary = "GymConfigUpdateView compares the manager's gym with the URL pk, not with the config's gym, so a manager edits and reads another gym's config whose pk equals their gym id."
tests = [
  "wger.gym.tests.test_gym_config_access.EditGymConfigOwnershipTestCase.test_config_of_other_gym",
  "wger.gym.tests.test_gym_config_access.EditGymConfigOwnershipTestCase.test_config_of_other_gym_with_two_fields",
  "wger.gym.tests.test_gym_config_access.EditGymConfigOwnershipTestCase.test_config_of_other_gym_is_not_shown",
]

[[defects]]
id = "s2-admin-config-no-permission"
rung = 2
kind = "security"
summary = "The gym admin ConfigUpdateView names permission_required but has no mixin that checks it, so an owner whose gym roles were removed still edits the admin config."
tests = [
  "wger.gym.tests.test_gym_config_access.EditConfigPermissionTestCase.test_owner_without_permission",
  "wger.gym.tests.test_gym_config_access.EditConfigPermissionTestCase.test_owner_without_permission_other_value",
]

[[defects]]
id = "s3-reset-password-higher-role"
rung = 2
kind = "security"
summary = "reset_user_password lets a gym manager reset, and read, the new password of the admin, a general manager, or a superuser of their gym."
tests = [
  "wger.gym.tests.test_reset_password_role.ResetPasswordHigherRoleTestCase.test_manager_cannot_reset_admin",
  "wger.gym.tests.test_reset_password_role.ResetPasswordHigherRoleTestCase.test_manager_cannot_reset_general_manager",
  "wger.gym.tests.test_reset_password_role.ResetPasswordHigherRoleTestCase.test_manager_cannot_reset_superuser",
]

[[defects]]
id = "s4-reset-password-gym-staff"
rung = 2
kind = "security"
summary = "reset_user_password lets a gym manager reset, and read, the new password of a fellow manager or a trainer of their gym, also a deactivated trainer."
solution = "s3-reset-password-higher-role"
tests = [
  "wger.gym.tests.test_reset_password_role.ResetPasswordGymStaffTestCase.test_manager_cannot_reset_fellow_manager",
  "wger.gym.tests.test_reset_password_role.ResetPasswordGymStaffTestCase.test_manager_cannot_reset_trainer",
  "wger.gym.tests.test_reset_password_role.ResetPasswordGymStaffTestCase.test_manager_cannot_reset_deactivated_trainer",
]

[[defects]]
id = "s5-reset-password-general-manager"
rung = 2
kind = "security"
summary = "reset_user_password lets a general manager reset, and read, the new password of the admin, another general manager, or a superuser."
solution = "s3-reset-password-higher-role"
tests = [
  "wger.gym.tests.test_reset_password_role.ResetPasswordGeneralManagerTestCase.test_general_manager_cannot_reset_admin",
  "wger.gym.tests.test_reset_password_role.ResetPasswordGeneralManagerTestCase.test_general_manager_cannot_reset_general_manager",
  "wger.gym.tests.test_reset_password_role.ResetPasswordGeneralManagerTestCase.test_general_manager_cannot_reset_superuser",
]

[[defects]]
id = "s6-reset-password-deactivated-role"
rung = 3
kind = "security"
summary = "reset_user_password lets a gym manager reset the password of a deactivated general manager or admin of their gym, then activate it; has_perm() is False for an inactive account."
solution = "s3-reset-password-higher-role"
tests = [
  "wger.gym.tests.test_reset_password_role.ResetPasswordDeactivatedRoleTestCase.test_manager_cannot_reset_deactivated_general_manager",
  "wger.gym.tests.test_reset_password_role.ResetPasswordDeactivatedRoleTestCase.test_manager_cannot_reset_deactivated_admin",
]

[regression]
tests = [
  "wger.gym.tests.test_gym_config_access.EditGymConfigOwnershipTestCase.test_config_of_own_gym_same_id",
  "wger.gym.tests.test_gym_config_access.EditConfigPermissionTestCase.test_owner_with_permission",
  "wger.gym.tests.test_gym_config_access.EditConfigPermissionTestCase.test_manager_owner_with_permission",
  "wger.gym.tests.test_reset_password_role.ResetPasswordAllowedTestCase.test_manager_can_reset_member",
  "wger.gym.tests.test_reset_password_role.ResetPasswordAllowedTestCase.test_general_manager_can_reset_trainer",
  "wger.gym.tests.test_reset_password_role.ResetPasswordAllowedTestCase.test_general_manager_can_reset_manager",
  "wger.gym.tests.test_reset_password_role.ResetPasswordAllowedTestCase.test_superuser_can_reset_general_manager",
  "wger.gym.tests.test_config",
  "wger.gym.tests.test_admin_config",
  "wger.gym.tests.test_user_config",
  "wger.gym.tests.test_gym",
  "wger.gym.tests.test_inactive_members",
  "wger.gym.tests.test_user",
]
