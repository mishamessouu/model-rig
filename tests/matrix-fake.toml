# Cells for the rig's own tests. The fake agent makes no model call.
repeats = 1
timeout_seconds = 60
budget_usd = 0.0

[[cells]]
name = "fake-none"
harness = "fake"
model = "none"

[[cells]]
name = "fake-s1"
harness = "fake"
model = "s1-sql-injection"

[[cells]]
name = "fake-probe"
harness = "fake"
model = "probe"

[[cells]]
name = "fake-s1-commit"
harness = "fake"
model = "s1-sql-injection"
commit = true

# Fixes s1, then writes git settings that would run a command on the host
# and hide the change, if the host ran git with the agent's settings.
[[cells]]
name = "fake-s1-escape-git"
harness = "fake"
model = "s1-sql-injection"
escape_git = true

# Reports its folder, environment, and mounts, to show that no path the
# agent can see names the scenario, the cell, or the run.
[[cells]]
name = "fake-leakprobe"
harness = "fake"
model = "leakprobe"

# Tries the network from inside the sandbox. The test points its `hosts`
# at a local echo server; a cell's `hosts` replaces its harness's list in
# config/network.toml.
[[cells]]
name = "fake-netprobe"
harness = "fake"
model = "netprobe"

# The same probe with no hosts: the sandbox must have no network at all.
[[cells]]
name = "fake-netprobe-offline"
harness = "fake"
model = "netprobe"
